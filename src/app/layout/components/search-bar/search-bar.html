<div class="relative w-64 md:w-80">
  <input
    [formControl]="searchControl"
    (focus)="isOpen.set(true)"
    type="text"
    placeholder="Buscar sección..."
    class="w-full h-9 pl-9 pr-3 bg-zinc-950/80 border border-zinc-800 rounded-lg text-xs text-zinc-100 placeholder:text-zinc-600 focus:outline-none focus:border-zinc-500 transition-colors"
  />

  <svg
    class="w-4 h-4 absolute left-3 top-2.5 text-zinc-500 pointer-events-none"
    xmlns="http://www.w3.org/2000/svg"
    fill="none"
    viewBox="0 0 24 24"
    stroke="currentColor"
    stroke-width="1.5">
    <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
  </svg>

  @if (isOpen() && query()) {
    <div class="fixed inset-0 z-40" (click)="closeDropdown()"></div>
  }

  @if (isOpen() && query()) {
    <div class="absolute left-0 right-0 top-11 bg-zinc-900 border border-zinc-800 rounded-xl shadow-2xl overflow-hidden z-50 p-1.5 space-y-1">
      @for (item of results(); track item.route) {
        <button
          type="button"
          (click)="selectOption(item.route)"
          class="w-full text-left px-3 py-2 rounded-lg hover:bg-zinc-800/80 transition-colors flex items-center justify-between group cursor-pointer">
          <span class="text-xs font-medium text-zinc-200 group-hover:text-white">
            {{ item.label }}
          </span>
          <span class="text-[10px] text-zinc-500 bg-zinc-950 px-2 py-0.5 rounded border border-zinc-800">
            {{ item.category }}
          </span>
        </button>
      } @empty {
        <div class="p-3 text-center text-xs text-zinc-500">
          No se encontraron resultados para "{{ query() }}"
        </div>
      }
    </div>
  }
</div>
