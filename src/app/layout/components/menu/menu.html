<!-- Flotante -->
<div class="absolute right-0 mt-2 w-60 bg-zinc-900/95 border border-zinc-800/90 rounded-xl shadow-xl p-2.5 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 backdrop-blur-md z-50">

  <!-- Usuario -->
  <div class="px-2 py-1.5 border-b border-zinc-800/80 mb-1.5">
    <p class="text-xs font-medium text-white truncate">{{ fullname()}}</p>
    <p class="text-[11px] text-zinc-400 truncate font-mono mt-0.5">{{ authService.currentUser()?.email }}</p>
  </div>

  <div class="py-1">
    <p class="px-2 py-1 text-[11px] font-semibold text-zinc-500 tracking-wider">
      Theme
    </p>
    <div class="space-y-0.5">
      @for (theme of themeService.themes; track theme.id) {
        <button
          (click)="themeService.setTheme(theme.id)"
          class="w-full flex items-center gap-2 px-2 py-1.5 rounded-lg text-xs transition-colors cursor-pointer"
          [ngClass]="{
          'text-white bg-zinc-800/80': themeService.currentTheme() === theme.id,
          'text-zinc-400 hover:text-zinc-200 hover:bg-zinc-800/40': themeService.currentTheme() !== theme.id
        }">
        <span
          class="w-1.5 h-1.5 rounded-full transition-colors"
          [class.bg-zinc-300]="themeService.currentTheme() === theme.id"
          [class.bg-transparent]="themeService.currentTheme() !== theme.id">
        </span>
          {{ theme.label }}
        </button>
      }
    </div>
  </div>

  <div class="border-t border-zinc-800/80 my-1"></div>

  <button
    (click)="logout()"
    class="cursor-pointer w-full text-left px-2 py-1.5 rounded-lg text-xs text-red-400 hover:bg-red-500/10 transition-colors font-medium">
    Cerrar Sesión
  </button>

</div>
