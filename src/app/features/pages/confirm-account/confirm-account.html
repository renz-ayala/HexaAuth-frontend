<div class="min-h-screen bg-zinc-950 text-zinc-100 flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-zinc-900/60 border border-zinc-800/80 rounded-xl p-8 shadow-2xl backdrop-blur-sm text-center">

    @if (isLoading()) {
      <div class="flex flex-col items-center justify-center space-y-3 py-4">
        <span class="loading loading-spinner loading-md text-zinc-400"></span>
        <h1 class="text-xl font-semibold tracking-tight text-white">
          Verificando cuenta
        </h1>
        <p class="text-sm text-zinc-400">
          Espere mientras se valida la cuenta.
        </p>
      </div>
    } @else {
      <div class="mb-6">
        <h1 class="text-2xl font-semibold tracking-tight text-white mb-1.5">
          {{message()}}
        </h1>
        <p class="text-sm text-zinc-400">
          Puedes ir al inicio de sesión o registrarte nuevamente.
        </p>
      </div>

      <div class="space-y-3">
        <button
          (click)="goToLogin()"
          class="btn w-full bg-zinc-100 hover:bg-white text-zinc-950 font-medium border-0 rounded-lg text-sm transition-all shadow-sm">
          Iniciar Sesión
        </button>

        <button
          (click)="goToRegister()"
          class="btn w-full bg-zinc-950/80 hover:bg-zinc-900 text-zinc-200 border border-zinc-800/80 rounded-lg text-sm transition-all">
          Registro
        </button>
      </div>
    }
  </div>
</div>
