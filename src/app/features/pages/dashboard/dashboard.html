<div class="min-h-screen bg-zinc-950 text-zinc-100 font-sans">
  <app-header></app-header>
  <div class="max-w-6xl mx-auto px-6 py-10 grid grid-cols-1 md:grid-cols-4 gap-8">
    <aside class="space-y-1">
      @for (group of navigationMenu; track group.groupName) {
        <div class="px-3 pb-2 text-xs font-semibold text-zinc-500 uppercase tracking-wider">
          {{ group.groupName }}
        </div>

        <nav class="flex flex-col space-y-1">
          @for (item of group.items; track item.route) {
            <a
              [routerLink]="item.route"
              routerLinkActive="bg-zinc-800/60 text-white font-medium"
              class="flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm text-zinc-400 hover:text-zinc-200 hover:bg-zinc-900/80 transition-colors">
              {{ item.label }}
            </a>
          }
        </nav>
      }
    </aside>

    <main class="md:col-span-3">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
