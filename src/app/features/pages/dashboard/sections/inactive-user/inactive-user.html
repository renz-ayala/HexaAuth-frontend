<section class="bg-red-950/10 border border-red-900/30 rounded-2xl overflow-hidden shadow-xl backdrop-blur-sm">
  <div class="divide-y divide-red-900/20">

    <div class="p-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4 hover:bg-red-950/10 transition-colors">
      <div class="space-y-1">
        <h3 class="text-sm font-medium text-zinc-200">Desactivar cuenta</h3>
        <p class="text-xs text-zinc-400 max-w-md">
          Se cerrará tu sesión actual. No podrás ingresar nuevamente hasta solicitar un restablecimiento de contraseña.
        </p>
      </div>

      <button
        [appLoading]="isDeactiveLoading()"
        (click)="onInactivateAccount()"
        [disabled]="isDeactiveLoading()"
        class="btn btn-sm text-xs font-semibold text-red-200 bg-red-900/40 hover:bg-red-800/60 border-red-700/50 rounded-xl transition-all shadow-sm active:scale-95 disabled:opacity-50 disabled:pointer-events-none whitespace-nowrap">

        @if (isDeactiveLoading()) {
          <span-spinner text="Desactivando..."></span-spinner>
        } @else {
          <span>Desactivar cuenta</span>
        }
      </button>
    </div>

    <div class="p-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4 hover:bg-red-950/10 transition-colors">
      <div class="space-y-1">
        <h3 class="text-sm font-medium text-zinc-200">Eliminar cuenta</h3>
        <p class="text-xs text-zinc-400 max-w-md">
          Se cerrará tu sesión actual. Se eliminarán tus datos y no podrás ingresar nuevamente.
        </p>
      </div>

      <button
        [appLoading]="isDeleteLoading()"
        (click)="onDeleteAccount()"
        [disabled]="isDeleteLoading()"
        class="btn btn-sm btn-error text-xs font-semibold text-white bg-red-600/80 hover:bg-red-600 border-red-500/50 rounded-xl transition-all shadow-sm active:scale-95 disabled:opacity-50 disabled:pointer-events-none whitespace-nowrap">

        @if (isDeleteLoading()) {
          <span-spinner text="Eliminando..."></span-spinner>
        } @else {
          <span>Eliminar cuenta</span>
        }
      </button>
    </div>

  </div>

</section>

<app-confirm-modal #confirmModal></app-confirm-modal>
