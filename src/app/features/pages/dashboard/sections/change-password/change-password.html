<div class="max-w-3xl mx-auto space-y-6">
  <section class="bg-zinc-900/40 border border-zinc-800/80 rounded-xl p-6 shadow-sm backdrop-blur-sm">
    <div class="mb-6 pb-4 border-b border-zinc-800/60">
      <h2 class="text-lg font-medium text-white tracking-tight">Actualizar Contraseña</h2>
      <p class="text-xs text-zinc-400">Actualiza tu contraseña de acceso para mantener tu cuenta segura.</p>
    </div>

    <form [formGroup]="changePasswordForm" (ngSubmit)="changePassword()" class="space-y-4">
      <app-password-input
        label="Contraseña Actual"
        [value]="changePasswordForm.get('currentPassword')?.value"
        (valueChange)="changePasswordForm.get('currentPassword')?.setValue($event)"
      />

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <app-password-input
          label="Nueva Contraseña"
          [value]="changePasswordForm.get('newPassword')?.value"
          (valueChange)="changePasswordForm.get('newPassword')?.setValue($event)"
        />

        <app-password-input
          label="Confirmar Nueva Contraseña"
          [value]="changePasswordForm.get('confirmPassword')?.value"
          (valueChange)="changePasswordForm.get('confirmPassword')?.setValue($event)"
        />
      </div>

      <div class="pt-3 flex items-center justify-end border-t border-zinc-800/40">
        <button
          type="submit"
          [appLoading]="isLoading()"
          [disabled]="changePasswordForm.invalid"
          class="cursor-pointer h-9 px-4 bg-zinc-100 hover:bg-white disabled:opacity-40 disabled:cursor-not-allowed text-zinc-950 font-medium rounded-lg text-xs transition-all shadow-sm"
        >
          @if (isLoading()) {
            <span-spinner text="Actualizando..."></span-spinner>
          } @else {
            <span>Actualizar Contraseña</span>
          }
        </button>
      </div>
    </form>
  </section>
</div>
