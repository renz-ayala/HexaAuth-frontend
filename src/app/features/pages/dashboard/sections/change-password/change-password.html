<div class="space-y-6">

  <!-- Sección 2: Cambio de Contraseña -->
  <section class="bg-zinc-900/40 border border-zinc-800/80 rounded-xl p-6 shadow-sm">
    <div class="mb-6 pb-4 border-b border-zinc-800/60">
      <h2 class="text-lg font-medium text-white tracking-tight">Seguridad</h2>
      <p class="text-xs text-zinc-400">Actualiza tu contraseña de acceso para mantener tu cuenta segura.</p>
    </div>

    <form [formGroup]="changePasswordForm" (ngSubmit)="onChangePassword()" class="space-y-4">

      <!-- Contraseña Actual -->
      <div>
        <label class="block text-xs font-medium text-zinc-300 mb-1">Contraseña Actual</label>
        <input
          type="password"
          formControlName="currentPassword"
          placeholder="••••••••"
          class="w-full h-10 px-3 bg-zinc-950/80 border border-zinc-800 rounded-lg text-sm text-zinc-100 focus:outline-none focus:border-zinc-500 transition-colors placeholder:text-zinc-600" />
      </div>

      <!-- Nueva Contraseña y Confirmación -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-medium text-zinc-300 mb-1">Nueva Contraseña</label>
          <input
            type="password"
            formControlName="newPassword"
            placeholder="••••••••"
            class="w-full h-10 px-3 bg-zinc-950/80 border border-zinc-800 rounded-lg text-sm text-zinc-100 focus:outline-none focus:border-zinc-500 transition-colors placeholder:text-zinc-600" />
        </div>
        <div>
          <label class="block text-xs font-medium text-zinc-300 mb-1">Confirmar Nueva Contraseña</label>
          <input
            type="password"
            formControlName="confirmPassword"
            placeholder="••••••••"
            class="w-full h-10 px-3 bg-zinc-950/80 border border-zinc-800 rounded-lg text-sm text-zinc-100 focus:outline-none focus:border-zinc-500 transition-colors placeholder:text-zinc-600" />
        </div>
      </div>

      <!-- Botón de acción con footer informativo -->
      <div class="pt-3 flex items-center justify-between border-t border-zinc-800/40">
        <span class="text-[11px] text-zinc-500">Mínimo 8 caracteres, incluye mayúsculas y números.</span>
        <button
          type="submit"
          [disabled]="changePasswordForm.invalid"
          class="h-9 px-4 bg-zinc-100 hover:bg-white disabled:opacity-40 disabled:cursor-not-allowed text-zinc-950 font-medium rounded-lg text-xs transition-all shadow-sm">
          Actualizar Contraseña
        </button>
      </div>

    </form>
  </section>

</div>
