<section class="bg-zinc-900/40 border border-zinc-800/80 rounded-2xl overflow-hidden shadow-xl backdrop-blur-sm">

  <div class="p-6 border-b border-zinc-800/80 flex items-center justify-between gap-4 bg-zinc-900/20">
    <div class="flex items-center gap-4">
      <div class="w-11 h-11 rounded-xl bg-gradient-to-br from-zinc-700 to-zinc-900 border border-zinc-700/80 flex items-center justify-center font-semibold text-zinc-100 text-sm shadow-inner">
        {{ authService.initials() }}
      </div>
      <div>
        <h2 class="text-base font-semibold text-white tracking-tight">Información de Usuario</h2>
        <p class="text-xs text-zinc-400">Detalles generales de tu cuenta registrada.</p>
      </div>
    </div>
  </div>

  <div class="divide-y divide-zinc-800/50">
    @for (item of details(); track item.key) {
      <div class="px-6 py-4 flex flex-col sm:flex-row sm:items-center justify-between gap-2 hover:bg-zinc-800/30 transition-colors group">
        <span class="text-xs font-medium text-zinc-400 group-hover:text-zinc-300 transition-colors">
          {{ item.label }}
        </span>

        <div class="flex items-center">
          <span [ngClass]="getItemClasses(item.type)">
            {{ item.value }}
          </span>
        </div>
      </div>
    }
  </div>

</section>
