<div class="min-h-screen bg-zinc-950 text-zinc-100 flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-zinc-900/60 border border-zinc-800/80 rounded-xl p-8 shadow-2xl backdrop-blur-sm">

    <div class="mb-8 text-center">
      <h1 class="text-2xl font-semibold tracking-tight text-white mb-2">
        Restablecer Contraseña
      </h1>
      <p class="text-sm text-zinc-400">
        Ingresa tu nueva contraseña para actualizar las credenciales de tu cuenta
      </p>
    </div>

    <form [formGroup]="resetForm" class="space-y-5" (ngSubmit)="onSubmit()">
      <div class="form-control w-full">
        <label class="label pl-0 pb-1.5">
          <span class="label-text text-xs font-medium text-zinc-300">Nueva Contraseña</span>
        </label>
        <app-password-input
          [value]="resetForm.get('password')?.value"
          (valueChange)="resetForm.get('password')?.setValue($event)"
        />
      </div>

      <div class="form-control w-full">
        <label class="label pl-0 pb-1.5">
          <span class="label-text text-xs font-medium text-zinc-300">Confirmar Contraseña</span>
        </label>
        <app-password-input
          [value]="resetForm.get('confirmPassword')?.value"
          (valueChange)="resetForm.get('confirmPassword')?.setValue($event)"
        />

        @if (resetForm.hasError('mismatch') && resetForm.get('confirmPassword')?.touched) {
          <span class="text-xs text-red-400 mt-1.5 block">
            Las contraseñas no coinciden.
          </span>
        }
      </div>

      <button
        type="submit"
        [appLoading]="isLoading()"
        [disabled]="resetForm.invalid"
        class="btn w-full bg-zinc-100 hover:bg-white text-zinc-950 font-medium border-0 rounded-lg text-sm mt-2 transition-all shadow-sm disabled:bg-zinc-800 disabled:text-zinc-500"
      >
        @if (isLoading()) {
          <span-spinner text="Actualizando..."></span-spinner>
        } @else {
          <span>Restablecer contraseña</span>
        }
      </button>
    </form>

    <div class="mt-6 text-center text-xs text-zinc-400">
      ¿Prefieres cancelar?
      <a (click)="redirectToLogin()" class="cursor-pointer text-zinc-200 hover:text-white font-medium underline underline-offset-4 transition-colors">
        Volver al inicio de sesión
      </a>
    </div>

  </div>
</div>
