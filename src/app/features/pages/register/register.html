<div class="min-h-screen bg-zinc-950 text-zinc-100 flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-zinc-900/60 border border-zinc-800/80 rounded-xl p-8 shadow-2xl backdrop-blur-sm">

    <div class="mb-6 text-center">
      <h1 class="text-2xl font-semibold tracking-tight text-white mb-1.5">
        Crear una cuenta
      </h1>
      <p class="text-sm text-zinc-400">
        Ingresa tus datos para empezar
      </p>
    </div>

    <form [formGroup]="registerForm" class="space-y-4" (ngSubmit)="createUser()">
      <div class="grid grid-cols-2 gap-3">
        <div class="form-control w-full">
          <label class="label pl-0 pb-1">
            <span class="label-text text-xs font-medium text-zinc-300">Nombre</span>
          </label>
          <input
            type="text"
            formControlName="name"
            placeholder="Juan"
            class="input input-bordered w-full bg-zinc-950/80 border-zinc-800 text-zinc-100 placeholder:text-zinc-600 focus:outline-none focus:border-zinc-500 focus:ring-1 focus:ring-zinc-500 text-sm transition-all"
            required
          />
        </div>

        <div class="form-control w-full">
          <label class="label pl-0 pb-1">
            <span class="label-text text-xs font-medium text-zinc-300">Apellido</span>
          </label>
          <input
            type="text"
            formControlName="lastName"
            placeholder="Pérez"
            class="input input-bordered w-full bg-zinc-950/80 border-zinc-800 text-zinc-100 placeholder:text-zinc-600 focus:outline-none focus:border-zinc-500 focus:ring-1 focus:ring-zinc-500 text-sm transition-all"
            required
          />
        </div>
      </div>

      <div class="form-control w-full">
        <label class="label pl-0 pb-1">
          <span class="label-text text-xs font-medium text-zinc-300">Correo electrónico</span>
        </label>
        <input
          type="email"
          formControlName="email"
          placeholder="tu@ejemplo.com"
          class="input input-bordered w-full bg-zinc-950/80 border-zinc-800 text-zinc-100 placeholder:text-zinc-600 focus:outline-none focus:border-zinc-500 focus:ring-1 focus:ring-zinc-500 text-sm transition-all"
          required
        />
      </div>

      <div class="form-control w-full">
        <label class="label pl-0 pb-1">
          <span class="label-text text-xs font-medium text-zinc-300">Usuario</span>
        </label>
        <input
          type="text"
          formControlName="username"
          placeholder="tu_usuario"
          class="input input-bordered w-full bg-zinc-950/80 border-zinc-800 text-zinc-100 placeholder:text-zinc-600 focus:outline-none focus:border-zinc-500 focus:ring-1 focus:ring-zinc-500 text-sm transition-all"
          required
        />
      </div>

      <div class="form-control w-full">
        <label class="label pl-0 pb-1">
          <span class="label-text text-xs font-medium text-zinc-300">Contraseña</span>
        </label>
        <app-password-input
          [value]="registerForm.get('password')?.value"
          (valueChange)="registerForm.get('password')?.setValue($event)">
        </app-password-input>
      </div>

      <button
        type="submit"
        [appLoading]="isLoading()"
        class="btn w-full bg-zinc-100 hover:bg-white text-zinc-950 font-medium border-0 rounded-lg text-sm mt-3 transition-all shadow-sm"
      >
        @if (isLoading()) {
          <span-spinner text="Registrando..."></span-spinner>
        } @else {
          <span>Registrarse</span>
        }
      </button>
    </form>

    <div class="mt-6 text-center text-xs text-zinc-400">
      ¿Ya tienes una cuenta?
      <a (click)="redirectToLogin()" class="cursor-pointer text-zinc-200 hover:text-white font-medium underline underline-offset-4 transition-colors">
        Inicia sesión
      </a>
    </div>
  </div>
</div>
