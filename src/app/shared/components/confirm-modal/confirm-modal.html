@if (isOpen()) {
  <div class="modal modal-open backdrop-blur-sm z-50">
    <div class="modal-backdrop bg-black/70" (click)="cancel()"></div>

    <div class="modal-box relative max-w-md bg-zinc-900 border border-zinc-800 rounded-2xl p-6 shadow-2xl z-10 space-y-4">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-red-950/80 border border-red-800/50 flex items-center justify-center text-red-400 shrink-0">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
          </svg>
        </div>
        <div>
          <h3 class="text-base font-semibold text-white">{{ title() }}</h3>
          <p class="text-xs text-zinc-400">Atención requerida</p>
        </div>
      </div>

      <p class="text-xs text-zinc-300 leading-relaxed bg-zinc-950/50 p-3 rounded-xl border border-zinc-800/50">
        {{ message() }}
      </p>

      <div class="modal-action items-center justify-end gap-3 pt-2 mt-0">
        <button
          (click)="cancel()"
          class="btn btn-ghost btn-sm text-xs font-medium text-zinc-300 hover:text-white hover:bg-zinc-800 rounded-xl">
          {{ cancelText() }}
        </button>

        <button
          (click)="confirm()"
          class="btn btn-error btn-sm text-xs font-semibold text-red-200 bg-red-900/60 hover:bg-red-800/80 border-red-700/60 rounded-xl active:scale-95">
          {{ confirmText() }}
        </button>
      </div>
    </div>
  </div>
}
