<div class="fixed bottom-4 right-4 z-[9999] w-[calc(100%-2rem)] max-w-sm pointer-events-none flex flex-col gap-2">
  @for (item of alerts(); track item.id) {
    <div
      class="pointer-events-auto flex items-center justify-between gap-3 px-4 py-3 rounded-lg border shadow-xl backdrop-blur-md text-xs font-medium tracking-tight animate-in fade-in slide-in-from-bottom-3 transition-all duration-200 {{ styles[item.type] }}"
    >
      <span class="flex-1 leading-snug">
        {{ item.message }}
      </span>

      <button
        type="button"
        class="opacity-60 hover:opacity-100 transition-opacity p-0.5 rounded hover:bg-white/10 shrink-0"
        (click)="alertService.close(item.id)"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
  }
</div>
