<div>
  @if (label()) {
    <label class="block text-xs font-medium text-zinc-300 mb-1">{{ label() }}</label>
  }
  <div class="relative flex items-center">
    <input
      [type]="passwordType()"
      [value]="value()"
      placeholder="••••••••"
      (input)="onInputChange($event)"
      class="w-full h-10 pl-3 pr-10 bg-zinc-950/80 border border-zinc-800 rounded-lg text-sm text-zinc-100 focus:outline-none focus:border-zinc-500 transition-colors placeholder:text-zinc-600"
    />
    <button
      type="button"
      tabindex="-1"
      (click)="toggleVisibility()"
      class="absolute right-3 text-zinc-400 hover:text-zinc-200 transition-colors focus:outline-none cursor-pointer">
      @if (showPassword()) {
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.52 10.52 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />
        </svg>
      } @else {
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4">
          <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12c1.077 4.5 5.163 7.5 9.964 7.5s8.887-3 9.964-7.5c-1.077-4.5-5.163-7.5-9.964-7.5S3.113 7.5 2.036 12Z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
        </svg>
      }
    </button>
  </div>
</div>
